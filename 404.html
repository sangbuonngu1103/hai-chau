<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Không tìm thấy trang — Hải Châu, Nghệ An</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f5efe3;
      --paper-2: #efe6d5;
      --ink: #16242c;
      --coral: #dd5f3c;
      --gold: #c08a2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .wrap { max-width: 560px; }
    .code {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(5rem, 18vw, 9rem);
      line-height: 1;
      font-weight: 700;
      color: var(--coral);
      margin: 0;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      margin: 8px 0 12px;
    }
    p { font-size: 1.02rem; line-height: 1.7; color: #4a5a63; margin: 0 0 26px; }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: .02em;
      transition: background .25s ease, transform .25s ease;
    }
    a.btn:hover { background: var(--coral); transform: translateY(-2px); }
    .rule { width: 64px; height: 3px; background: var(--gold); margin: 0 auto 22px; border-radius: 2px; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <div class="rule"></div>
    <h1>Không tìm thấy trang</h1>
    <p>Đường dẫn bạn mở không tồn tại hoặc đã được di chuyển.<br />Hãy quay về trang chủ để tiếp tục khám phá Hải Châu, Nghệ An.</p>
    <a class="btn" href="index.html">← Về trang chủ</a>
  </main>
</body>
</html>
